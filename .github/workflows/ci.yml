name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host-quality:
    name: Host Formatting and Clippy (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Check operator-console JavaScript
        run: |
          node --check crates/kiko-slam/src/operator-console/view-model.js
          node --check crates/kiko-slam/src/operator-console/app.js

      - name: Compile the field expression specification
        run: >-
          python3 -m py_compile
          deploy/expression/compliant_head.py
          deploy/expression/fable_behavior_trace.py
          deploy/expression/head_thermal.py
          deploy/expression/kiko_face_follow.py
          deploy/expression/organic_motion.py
          deploy/expression/test_compliant_head.py
          deploy/expression/test_engine_lifecycle.py
          deploy/expression/test_fable_behavior_trace.py
          deploy/expression/test_head_thermal.py
          deploy/expression/test_organic_motion.py

      - name: Check standalone KEP2 eye firmware formatting
        run: >-
          cargo fmt --manifest-path firmware/eyes-kep2/Cargo.toml
          -- --check

      - name: Clippy standalone KEP2 eye firmware host logic
        run: >-
          cargo clippy --locked
          --manifest-path firmware/eyes-kep2/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Clippy robot protocol
        run: >-
          cargo clippy --locked -p robot-protocol --all-features --all-targets
          -- -D warnings

      - name: Clippy command client
        run: >-
          cargo clippy --locked -p robot-command-client --all-features
          --all-targets
          -- -D warnings

      - name: Clippy robot server
        run: cargo clippy --locked -p robot-server --all-targets -- -D warnings

      - name: Clippy robot server qualification fault injection
        run: >-
          cargo clippy --locked -p robot-server
          --no-default-features
          --features qualification-fault-injection
          --all-targets
          -- -D warnings

      - name: Clippy embedded pure logic
        run: cargo clippy --locked -p embedded --lib --tests -- -D warnings

      - name: Clippy minimal Kiko SLAM graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo clippy --locked -p kiko-slam
          --no-default-features
          --all-targets
          -- -D warnings

      - name: Clippy boot-journal provisioning tool
        run: >-
          cargo clippy --locked -p embedded
          --features boot-journal-tool
          --bin kiko-boot-journal-image
          -- -D warnings

      - name: Clippy Kiko Nano support crates
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo clippy --locked --no-deps
          -p kiko-base-commissioning
          -p kiko-device-inventory
          -p kiko-expression-core
          -p kiko-expression-runtime
          -p kiko-eye-protocol
          -p kiko-eye-runtime
          -p kiko-head-protocol
          -p kiko-head-runtime
          -p kiko-nano-bundle-renderer
          -p kiko-nano-deployment-gate
          -p kiko-supervisor-core
          --all-targets
          -- -D warnings

      - name: Check bundle renderer production dependency graph
        # `--all-targets` above activates the renderer's qualification-only
        # dev dependency and can hide missing exports in its smaller runtime
        # graph. Keep this exact library-only boundary as a separate check.
        run: >-
          cargo check --locked
          -p kiko-nano-bundle-renderer
          --lib

      - name: Clippy exact production Kiko Nano graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo clippy --locked -p kiko-slam
          --no-default-features
          --features nano-agent
          --all-targets
          -- -D warnings

      - name: Clippy exact attended wheels-off qualification graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo clippy --locked -p kiko-slam
          --no-default-features
          --features nano-wheels-off-qualification
          --all-targets
          -- -D warnings

      - name: Clippy exact attended wheel-on commissioning graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo clippy --locked -p kiko-slam
          --features nano-base-commissioning
          --all-targets
          -- -D warnings

      - name: Clippy complete attended auxiliary feature union
        # This is compile/test coverage only. Production artifacts are built
        # with the exact `nano-agent` feature set checked separately above.
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo clippy --locked -p kiko-slam
          --features nano-agent,nano-wheels-off-qualification,nano-base-commissioning
          --all-targets
          -- -D warnings

  host-tests:
    name: Host Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test robot protocol
        run: cargo test --locked -p robot-protocol --all-features

      - name: Test command client
        run: cargo test --locked -p robot-command-client --all-features

      - name: Test robot server
        run: cargo test --locked -p robot-server

      - name: Test robot server qualification fault injection
        run: >-
          cargo test --locked -p robot-server
          --no-default-features
          --features qualification-fault-injection

      - name: Test embedded pure logic
        run: cargo test --locked -p embedded --lib

      - name: Test boot-journal provisioning tool
        run: >-
          cargo test --locked -p embedded
          --features boot-journal-tool
          --bin kiko-boot-journal-image

      - name: Test operator-console pure browser logic
        run: >-
          node --test
          crates/kiko-slam/src/operator-console/view-model.test.js
          crates/kiko-slam/src/operator-console/drive-safety.test.js

      - name: Test standalone KEP2 eye firmware host logic
        run: >-
          cargo test --locked
          --manifest-path firmware/eyes-kep2/Cargo.toml

      # This attended Python lane is the executable behavior specification
      # until its field-proven incidents and motion semantics have equivalent
      # coverage in the sole-owner Rust runtime. Keeping it in CI prevents the
      # merge-back from silently drifting away from the robot-proven behavior.
      - name: Test the field expression specification
        run: >-
          python3 -m unittest discover
          -s deploy/expression
          -p 'test_*.py'

      - name: Test Kiko Nano support crates
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo test --locked
          -p kiko-base-commissioning
          -p kiko-device-inventory
          -p kiko-expression-core
          -p kiko-expression-runtime
          -p kiko-eye-protocol
          -p kiko-eye-runtime
          -p kiko-head-protocol
          -p kiko-head-runtime
          -p kiko-nano-bundle-renderer
          -p kiko-nano-deployment-gate
          -p kiko-supervisor-core

      - name: Test exact production Kiko Nano graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo test --locked -p kiko-slam
          --no-default-features
          --features nano-agent

      - name: Test exact attended wheels-off qualification graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo test --locked -p kiko-slam
          --no-default-features
          --features nano-wheels-off-qualification

      - name: Verify exact production command surface
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: |
          production_help="$(
            cargo run --locked -p kiko-slam --features nano-agent \
              --bin kiko-slam -- --help
          )"
          printf '%s\n' "${production_help}"
          if ! grep -Fq "nano-agent" <<<"${production_help}"; then
            echo "exact production build did not expose the production command" >&2
            exit 1
          fi
          if grep -Fq "nano-wheels-off-qualification" <<<"${production_help}"; then
            echo "exact production build exposed the attended qualification command" >&2
            exit 1
          fi
          if grep -Fq "nano-base-commission" <<<"${production_help}"; then
            echo "exact production build exposed the attended commissioning command" >&2
            exit 1
          fi

      - name: Test exact attended wheel-on commissioning graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo test --locked -p kiko-slam
          --features nano-base-commissioning

      - name: Test complete Kiko Nano host graph
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo test --locked -p kiko-slam
          --features nano-agent,nano-wheels-off-qualification,nano-base-commissioning

      - name: Run offline Nano cold-boot and fault acceptance
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: tools/nano-cold-boot-fault-acceptance.sh

  linux-aarch64-check:
    name: Portable Host Compile (Linux aarch64)
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain and Linux aarch64 target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Linux aarch64 C toolchain
        # Rerun's Rust graph reaches `ring`, whose build script compiles
        # target-specific C/assembly even under `cargo check`.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: Compile portable host crates for Linux aarch64
        # `cargo check` proves target compilation only; it does not execute
        # aarch64 code. The native bridge check-only mode proves Rust target
        # closure without pretending an SDK or camera was exercised.
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo check --locked --target aarch64-unknown-linux-gnu
          --all-targets
          -p robot-protocol
          -p robot-command-client
          -p robot-server
          -p kiko-base-commissioning
          -p kiko-device-inventory
          -p kiko-expression-core
          -p kiko-expression-runtime
          -p kiko-eye-protocol
          -p kiko-eye-runtime
          -p kiko-head-protocol
          -p kiko-head-runtime
          -p kiko-nano-bundle-renderer
          -p kiko-nano-deployment-gate
          -p kiko-supervisor-core

      - name: Compile boot-journal provisioning tool for Linux aarch64
        run: >-
          cargo check --locked --target aarch64-unknown-linux-gnu
          -p embedded
          --features boot-journal-tool
          --bin kiko-boot-journal-image

      - name: Compile exact production Nano graph for Linux aarch64
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo check --locked --target aarch64-unknown-linux-gnu
          -p kiko-slam
          --features nano-agent
          --all-targets

      - name: Compile exact attended qualification graph for Linux aarch64
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo check --locked --target aarch64-unknown-linux-gnu
          -p kiko-slam
          --features nano-wheels-off-qualification
          --all-targets

      - name: Compile exact attended wheel-on commissioning graph for Linux aarch64
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo check --locked --target aarch64-unknown-linux-gnu
          -p kiko-slam
          --features nano-base-commissioning
          --all-targets

      - name: Compile complete attended auxiliary union for Linux aarch64
        # Compile-only coverage; this feature union is never a production
        # deployment artifact.
        env:
          OAK_SYS_CHECK_ONLY: "1"
        run: >-
          cargo check --locked --target aarch64-unknown-linux-gnu
          -p kiko-slam
          --features nano-agent,nano-wheels-off-qualification,nano-base-commissioning
          --all-targets

  embedded-firmware:
    name: STM32 Firmware Build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain and embedded target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
          targets: thumbv7em-none-eabihf,thumbv8m.main-none-eabihf

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: thumbv7em-none-eabihf

      - name: Clippy firmware
        run: >-
          cargo clippy --locked -p embedded --features firmware
          --bin embedded
          --target thumbv7em-none-eabihf -- -D warnings

      - name: Check firmware
        run: >-
          cargo check --locked -p embedded --features firmware
          --bin embedded
          --target thumbv7em-none-eabihf

      - name: Build release firmware
        run: >-
          cargo build --locked --release -p embedded --features firmware
          --bin embedded
          --target thumbv7em-none-eabihf

      - name: Clippy attended four-PWM candidate firmware
        run: >-
          cargo clippy --locked -p embedded
          --features firmware,flash-boot-journal,operator-supervised-four-pwm-candidate
          --bin embedded
          --target thumbv7em-none-eabihf -- -D warnings

      - name: Build attended four-PWM candidate firmware
        run: >-
          cargo build --locked --release -p embedded
          --features firmware,flash-boot-journal,operator-supervised-four-pwm-candidate
          --bin embedded
          --target thumbv7em-none-eabihf

      - name: Clippy distinct attended wheel-on commissioning firmware
        run: >-
          cargo clippy --locked -p embedded
          --features firmware,flash-boot-journal,attended-wheel-on-commissioning
          --bin embedded
          --target thumbv7em-none-eabihf -- -D warnings

      - name: Build distinct attended wheel-on commissioning firmware
        run: >-
          cargo build --locked --release -p embedded
          --features firmware,flash-boot-journal,attended-wheel-on-commissioning
          --bin embedded
          --target thumbv7em-none-eabihf

      - name: Build standalone KEP2 RP2350 eye firmware
        # This fixed provisioning is intentionally non-deployable compile
        # evidence. CI never publishes this artifact; a physical release must
        # use a fresh byte identity and the reviewed panel polarity.
        env:
          KIKO_EYE_FIRMWARE_BUILD_ID_HEX: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
          KIKO_EYE_RIGHT_X_SIGN: "1"
        run: >-
          cargo build --locked --release
          --manifest-path firmware/eyes-kep2/Cargo.toml
          --target thumbv8m.main-none-eabihf
          --features rp2350
          --bin kiko-eyes-kep2-rp2350

      - name: Reject unsafe motion-firmware feature combinations
        shell: bash
        run: |
          expect_compile_failure() {
            local feature_set="$1"
            if cargo check --locked -p embedded \
              --features "${feature_set}" \
              --bin embedded \
              --target thumbv7em-none-eabihf
            then
              echo "unsafe feature set compiled successfully: ${feature_set}" >&2
              exit 1
            fi
          }

          expect_compile_failure \
            "firmware,operator-supervised-four-pwm-candidate"
          expect_compile_failure \
            "firmware,external-boot-identity,flash-boot-journal"
          expect_compile_failure \
            "firmware,external-boot-identity,flash-boot-journal,operator-supervised-four-pwm-candidate"
          expect_compile_failure \
            "firmware,attended-wheel-on-commissioning"
          expect_compile_failure \
            "firmware,external-boot-identity,flash-boot-journal,attended-wheel-on-commissioning"
          expect_compile_failure \
            "firmware,flash-boot-journal,operator-supervised-four-pwm-candidate,attended-wheel-on-commissioning"
