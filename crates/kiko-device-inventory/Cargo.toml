[package]
name = "kiko-device-inventory"
version = "0.1.0"
edition = "2024"
description = "Typed Kiko device inventory with bounded Unix manifest and artifact boundaries"
license = "MIT OR Apache-2.0"

[dependencies]
kiko-eye-protocol = { path = "../kiko-eye-protocol" }
kiko-head-protocol = { path = "../kiko-head-protocol" }
robot-protocol = { path = "../../comms/robot-protocol" }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true

[[bench]]
name = "inventory"
harness = false
