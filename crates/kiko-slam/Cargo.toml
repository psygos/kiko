[package]
name = "kiko-slam"
version = "0.1.0"
edition = "2024"

[features]
default = []
record = ["oak-sys", "ctrlc", "chrono"]
actuation = ["dep:robot-command-client", "dep:sha2"]
agent-runtime = [
    "dep:kiko-device-inventory",
    "dep:kiko-expression-core",
    "dep:kiko-expression-runtime",
    "dep:kiko-eye-protocol",
    "dep:kiko-eye-runtime",
    "dep:kiko-head-protocol",
    "dep:kiko-head-runtime",
    "dep:kiko-supervisor-core",
]
nano-bench = ["agent-runtime", "actuation", "record", "dep:robot-server", "dep:tokio"]
ort-coreml = ["ort/coreml"]
ort-cuda = ["ort/cuda"]
ort-tensorrt = ["ort/tensorrt"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4.5.28", features = ["derive", "env"] }
crossbeam-channel = "0.5.13"
libc = "0.2.153"
libloading = "0.9.0"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-24"] }
rerun = { version = "=0.27.2", default-features = false, features = ["sdk", "server"] }
robot-protocol = { path = "../../comms/robot-protocol" }
robot-command-client = { path = "../../comms/robot-command-client", optional = true }
robot-server = { path = "../../comms/robot-server", optional = true }
kiko-device-inventory = { path = "../kiko-device-inventory", optional = true }
kiko-expression-core = { path = "../kiko-expression-core", optional = true }
kiko-expression-runtime = { path = "../kiko-expression-runtime", optional = true }
kiko-eye-protocol = { path = "../kiko-eye-protocol", optional = true }
kiko-eye-runtime = { path = "../kiko-eye-runtime", optional = true }
kiko-head-protocol = { path = "../kiko-head-protocol", optional = true }
kiko-head-runtime = { path = "../kiko-head-runtime", optional = true }
kiko-supervisor-core = { path = "../kiko-supervisor-core", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10", optional = true }
slotmap = "1.0"
oak-sys = { path = "../oak-sys", optional = true }
ctrlc = { version = "3.4", optional = true }
chrono = { version = "0.4", optional = true }
tokio = { version = "1.35", optional = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "kiko-slam"
path = "src/bin/kiko_slam.rs"

[[bin]]
name = "kiko-nano-wheels-off-bench"
path = "src/bin/kiko_nano_wheels_off_bench.rs"
required-features = ["nano-bench"]

[[bench]]
name = "pose_graph_jacobians"
harness = false

[[bench]]
name = "descriptor_matching"
harness = false

[[bench]]
name = "occupancy_mapping"
harness = false

[[bench]]
name = "navigation_planning"
harness = false

[[bench]]
name = "navigation_shadow"
harness = false

[lints]
workspace = true
