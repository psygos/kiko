[package]
name = "kiko-slam"
version = "0.1.0"
edition = "2024"

[features]
default = []
record = ["oak-sys", "ctrlc", "chrono"]
actuation = ["dep:robot-command-client", "dep:sha2"]
agent-runtime = [
    "dep:kiko-device-inventory",
    "dep:kiko-expression-core",
    "dep:kiko-expression-runtime",
    "dep:kiko-eye-protocol",
    "dep:kiko-eye-runtime",
    "dep:kiko-head-protocol",
    "dep:kiko-head-runtime",
    "dep:kiko-supervisor-core",
    "dep:tokio",
]
# Offline calibration preparation only. Make its no-replace filesystem
# primitive explicit without broadening generic agent-runtime/actuation builds.
nano-calibration-prepare = ["agent-runtime", "actuation", "dep:rustix"]
operator-console = ["dep:bytes", "dep:getrandom", "dep:rustix", "dep:tokio", "dep:warp"]
production-navigation-binding = ["agent-runtime", "actuation", "dep:robot-server"]
nano-agent = [
    "agent-runtime",
    "actuation",
    "production-navigation-binding",
    "operator-console",
    "record",
    "nano-face-perception",
    "dep:kiko-nano-deployment-gate",
    "dep:rustix",
]
# Host-side OpenCV perception seam. Production `nano-agent` includes this
# feature; it remains independently selectable for hardware-free/check-only
# boundary tests.
nano-face-perception = [
    "agent-runtime",
    "oak-sys/opencv-face-detector",
]
# Manually invoked, wheels-off-only qualification surface. The production
# deployment is built with `nano-agent` alone, so its exact binary contains no
# candidate entry point.
nano-wheels-off-qualification = [
    "nano-agent",
    "robot-server/qualification-fault-injection",
]
# Manually invoked, attended, wheel-on commissioning lane. Production
# `nano-agent` does not enable this feature and therefore contains no
# commissioning actuation entry point.
nano-base-commissioning = [
    "agent-runtime",
    "actuation",
    "operator-console",
    "record",
    "dep:kiko-base-commissioning",
    "dep:robot-server",
    "dep:rustix",
]
ort-coreml = ["ort/coreml"]
ort-cuda = ["ort/cuda"]
ort-tensorrt = ["ort/tensorrt"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
bytes = { version = "1.5", optional = true }
clap = { version = "4.5.28", features = ["derive", "env"] }
crossbeam-channel = "0.5.13"
libc = "0.2.153"
libloading = "0.9.0"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-24"] }
rerun = { version = "=0.27.2", default-features = false, features = ["sdk", "server"] }
robot-protocol = { path = "../../comms/robot-protocol" }
robot-command-client = { path = "../../comms/robot-command-client", optional = true }
robot-server = { path = "../../comms/robot-server", optional = true }
kiko-device-inventory = { path = "../kiko-device-inventory", optional = true }
kiko-expression-core = { path = "../kiko-expression-core", optional = true }
kiko-expression-runtime = { path = "../kiko-expression-runtime", optional = true }
kiko-eye-protocol = { path = "../kiko-eye-protocol", optional = true }
kiko-eye-runtime = { path = "../kiko-eye-runtime", optional = true }
kiko-head-protocol = { path = "../kiko-head-protocol", optional = true }
kiko-head-runtime = { path = "../kiko-head-runtime", optional = true }
kiko-base-commissioning = { path = "../kiko-base-commissioning", optional = true, features = ["serde"] }
kiko-nano-deployment-gate = { path = "../kiko-nano-deployment-gate", optional = true }
kiko-supervisor-core = { path = "../kiko-supervisor-core", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10", optional = true }
slotmap = "1.0"
oak-sys = { path = "../oak-sys", optional = true }
ctrlc = { version = "3.4", features = ["termination"], optional = true }
chrono = { version = "0.4", optional = true }
getrandom = { version = "0.3", features = ["std"], optional = true }
rustix = { version = "1.1", features = ["fs", "process", "termios"], optional = true }
tokio = { version = "1.35", optional = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
warp = { version = "0.3", optional = true }

[[bin]]
name = "kiko-slam"
path = "src/bin/kiko_slam.rs"

[[bin]]
name = "kiko-nano-deployment-qualify"
path = "src/bin/kiko_nano_deployment_qualify.rs"
required-features = ["nano-agent"]

[[bin]]
name = "kiko-nano-base-commission"
path = "src/bin/kiko_nano_base_commission.rs"
required-features = ["nano-base-commissioning"]

[[bin]]
name = "kiko-nano-calibration-prepare"
path = "src/bin/kiko_nano_calibration_prepare.rs"
required-features = ["nano-calibration-prepare"]

[[bench]]
name = "pose_graph_jacobians"
harness = false

[[bench]]
name = "descriptor_matching"
harness = false

[[bench]]
name = "occupancy_mapping"
harness = false

[[bench]]
name = "navigation_planning"
harness = false

[[bench]]
name = "navigation_shadow"
harness = false

[lints]
workspace = true
