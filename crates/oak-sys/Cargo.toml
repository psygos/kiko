[package]
name = "oak-sys"
version = "0.1.0"
edition = "2021"
description = "FFI bindings to OAK-D camera via DepthAI"

[features]
default = []
rerun-view = ["dep:rerun"]

[dependencies]
cxx = "1.0"
rerun = { version = "=0.27.2", optional = true, default-features = false, features = ["sdk"] }
thiserror = "1.0"

[build-dependencies]
cxx-build = "1.0"

[[bin]]
name = "rerun_view"
path = "src/bin/rerun_view.rs"
required-features = ["rerun-view"]
