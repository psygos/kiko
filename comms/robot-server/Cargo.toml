[package]
name = "robot-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Attended wheels-off qualification only. Production owners do not compile
# the fault declarations, actor state, or recovery evidence.
qualification-fault-injection = []

[dependencies]
tokio = { version = "1.35", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5.4"
clap = { version = "4.5.28", features = ["derive"] }
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
robot-protocol = { path = "../robot-protocol", features = ["serde"] }
getrandom = { version = "0.3", features = ["std"] }

[dev-dependencies]
bincode = "1.3"
robot-command-client = { path = "../robot-command-client" }
tokio = { version = "1.35", features = ["test-util"] }

[lints]
workspace = true
